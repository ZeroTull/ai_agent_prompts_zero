name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh tests/*.sh
      - name: Validate agents and skills
        run: tests/validate.sh
      - name: Test installer
        run: tests/test_install.sh
